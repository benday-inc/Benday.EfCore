name: Benday.EfCore CI

on:
  push:
    branches: [ "main" ]
    paths:
      - 'src/**'
      - 'test/**'
      - 'Benday.EfCore.slnx'
      - 'global.json'
      - '.github/workflows/benday-efcore.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'src/**'
      - 'test/**'
      - 'Benday.EfCore.slnx'
      - 'global.json'
      - '.github/workflows/benday-efcore.yml'
  workflow_dispatch:

# checks: write lets dorny/test-reporter publish a check run with the test results.
# (Fork PRs get a read-only token, so the reporter can't post there -- fine for this repo.)
permissions:
  contents: read
  actions: read
  checks: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

# Test commands use Microsoft.Testing.Platform options (global.json sets the MTP runner),
# so TRX output is --report-xunit-trx, not the VSTest-style --logger "trx".

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build solution (Release)
        run: dotnet build Benday.EfCore.slnx --configuration Release

      - name: Run unit tests
        run: >-
          dotnet test --project test/Benday.EfCore.SqlServer.UnitTests/Benday.EfCore.SqlServer.UnitTests.csproj
          --configuration Release --no-build
          --report-xunit-trx --report-xunit-trx-filename unit-test-results.trx

      - name: Publish unit test report
        uses: dorny/test-reporter@v3
        if: ${{ !cancelled() }}
        with:
          name: Unit Tests
          path: '**/TestResults/unit-test-results.trx'
          reporter: dotnet-trx

      - name: Upload unit test results (TRX)
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: unit-test-results
          path: '**/TestResults/unit-test-results.trx'

      - name: Pack NuGet packages
        run: dotnet pack Benday.EfCore.slnx --configuration Release --no-build --output ./artifacts

      - name: Upload NuGet packages
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages-efcore
          path: ./artifacts/*.nupkg

  integration-tests:
    runs-on: ubuntu-latest

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2025-latest
        ports:
          - 1433:1433
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: Pa$$word
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Pa$$word' -C -Q 'SELECT 1' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 10s

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build integration tests (Release)
        run: dotnet build test/Benday.EfCore.SqlServer.IntegrationTests/Benday.EfCore.SqlServer.IntegrationTests.csproj --configuration Release

      # CI=true (set by the runner) makes the tests fail rather than skip when SQL Server is
      # unreachable, so a broken service container can't produce a green run with no real tests.
      - name: Run integration tests
        run: >-
          dotnet test --project test/Benday.EfCore.SqlServer.IntegrationTests/Benday.EfCore.SqlServer.IntegrationTests.csproj
          --configuration Release --no-build
          --report-xunit-trx --report-xunit-trx-filename integration-test-results.trx

      - name: Publish integration test report
        uses: dorny/test-reporter@v3
        if: ${{ !cancelled() }}
        with:
          name: Integration Tests
          path: '**/TestResults/integration-test-results.trx'
          reporter: dotnet-trx

      - name: Upload integration test results (TRX)
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: integration-test-results
          path: '**/TestResults/integration-test-results.trx'

  deploy:
    needs: [unit-tests, integration-tests]
    runs-on: ubuntu-latest
    environment: nuget-deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: nuget-packages-efcore

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Push to NuGet
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if [ -z "$NUGET_API_KEY" ]; then
            echo "Error: NUGET_API_KEY secret is not set"
            exit 1
          fi
          dotnet nuget push *.nupkg -k "$NUGET_API_KEY" -s https://api.nuget.org/v3/index.json --skip-duplicate
